4.5" cy="28.5" rx="15" ry="7" transform="rotate(256 -114.5 28.5)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/><ellipse cx="-118.0" cy="0.0" rx="15" ry="7" transform="rotate(270 -118.0 0.0)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/><ellipse cx="-114.5" cy="-28.5" rx="15" ry="7" transform="rotate(284 -114.5 -28.5)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/><ellipse cx="-104.2" cy="-55.4" rx="15" ry="7" transform="rotate(298 -104.2 -55.4)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/><ellipse cx="-87.7" cy="-79.0" rx="15" ry="7" transform="rotate(312 -87.7 -79.0)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/><ellipse cx="-66.0" cy="-97.8" rx="15" ry="7" transform="rotate(326 -66.0 -97.8)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/><ellipse cx="-40.4" cy="-110.9" rx="15" ry="7" transform="rotate(340 -40.4 -110.9)" fill="#7cae4e" stroke="#5f8f3e" stroke-width="1.5"/>
