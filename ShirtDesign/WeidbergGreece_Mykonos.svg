<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" font-family="'Georgia','Times New Roman',serif">

  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.7" stop-color="#f6c445"/>
      <stop offset="1" stop-color="#f2b134"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa8d8"/>
      <stop offset="1" stop-color="#1c6ea4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6dcc7"/>
    </linearGradient>
  </defs>

  <!-- WEIDBERG / FAMILY VACATION -->
  <text x="400" y="122" text-anchor="middle" font-size="70" font-weight="bold" fill="#12496e" letter-spacing="4">WEIDBERG</text>
  <text x="400" y="164" text-anchor="middle" font-size="27" fill="#2f7fae" letter-spacing="11">FAMILY&#160;VACATION</text>

  <!-- Emblem -->
  <g transform="translate(400,420)">
    <circle r="150" fill="url(#sea)" stroke="#0f4f76" stroke-width="7"/>
    <clipPath id="clip"><circle r="146"/></clipPath>
    <g clip-path="url(#clip)">
      <rect x="-150" y="-150" width="300" height="210" fill="url(#sky)"/>
      <circle cx="-78" cy="-70" r="38" fill="url(#sun)"/>
      <rect x="-150" y="60" width="300" height="90" fill="url(#sea)"/>
      <path d="M -150 60 q 30 12 60 0 t 60 0 t 60 0 t 60 0 t 60 0" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
      <!-- tower -->
      <path d="M -34 55 L -26 -46 L 26 -46 L 34 55 Z" fill="url(#stone)" stroke="#cbbf9e" stroke-width="2"/>
      <rect x="-30" y="-58" width="60" height="14" rx="3" fill="#efe7d4" stroke="#cbbf9e"/>
      <!-- conical roof -->
      <path d="M -34 -58 L 0 -96 L 34 -58 Z" fill="#7a5a3a" stroke="#5f4527" stroke-width="2"/>
      <!-- windows/door -->
      <rect x="-8" y="20" width="16" height="30" fill="#1c6ea4"/>
      <rect x="-22" y="-30" width="12" height="12" fill="#1c6ea4"/>
      <rect x="10" y="-30" width="12" height="12" fill="#1c6ea4"/>
      <!-- sail blades -->
      <g stroke="#8a6a44" stroke-width="4" fill="#ffffff" fill-opacity="0.9">
        <g transform="translate(0,-62)">
          <rect x="-3" y="-70" width="6" height="70"/>
          <rect x="0" y="-3" width="70" height="6"/>
          <rect x="-70" y="-3" width="70" height="6"/>
          <rect x="-3" y="0" width="6" height="70"/>
          <path d="M 6 -60 L 44 -6 L 6 -6 Z" fill="#eef4f8"/>
          <path d="M 60 6 L 6 44 L 6 6 Z" fill="#eef4f8"/>
          <path d="M -6 60 L -44 6 L -6 6 Z" fill="#eef4f8"/>
          <path d="M -60 -6 L -6 -44 L -6 -6 Z" fill="#eef4f8"/>
        </g>
      </g>
    </g>
    <!-- olive branches flanking -->
    <g stroke="#5f8f3e" stroke-width="5" fill="#7cae4e">
      <path d="M -150 22 q -38 30 -52 78" fill="none"/>
      <ellipse cx="-178" cy="58" rx="10" ry="5" transform="rotate(-35 -178 58)"/>
      <ellipse cx="-192" cy="80" rx="10" ry="5" transform="rotate(-25 -192 80)"/>
      <ellipse cx="-200" cy="103" rx="10" ry="5" transform="rotate(-15 -200 103)"/>
      <path d="M 150 22 q 38 30 52 78" fill="none"/>
      <ellipse cx="178" cy="58" rx="10" ry="5" transform="rotate(35 178 58)"/>
      <ellipse cx="192" cy="80" rx="10" ry="5" transform="rotate(25 192 80)"/>
      <ellipse cx="200" cy="103" rx="10" ry="5" transform="rotate(15 200 103)"/>
    </g>
  </g>

  <!-- GREECE -->
  <text x="400" y="678" text-anchor="middle" font-size="78" font-weight="bold" fill="#12496e" letter-spacing="10">GREECE</text>

  <!-- Greek-key divider -->
  <g transform="translate(280,706)" stroke="#2f7fae" stroke-width="6" fill="none" stroke-linejoin="miter">
    <path d="M0 20 h18 v-16 h16 v16 h-9 v-9 h9
             M43 4 h18 v16 h16 v-16 h-9 v9 h9
             M86 20 h18 v-16 h16 v16 h-9 v-9 h9
             M129 4 h18 v16 h16 v-16 h-9 v9 h9
             M172 20 h18 v-16 h16 v16 h-9 v-9 h9"/>
  </g>

  <!-- SUMMER JULY 2026 -->
  <text x="400" y="782" text-anchor="middle" font-size="32" fill="#2f7fae" letter-spacing="7">SUMMER&#160;&#8226;&#160;JULY&#160;2026</text>
  <text x="400" y="820" text-anchor="middle" font-size="19" font-style="italic" fill="#6b8697" letter-spacing="1">&#963;&#945;&#962;&#160;&#960;&#945;&#961;&#945;&#954;&#945;&#955;&#974; &#8212; &#8220;Please&#8221;, pack the sunscreen!</text>
</svg>